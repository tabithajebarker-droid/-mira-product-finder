
name: Import Mira Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type IMPORT to confirm"
        required: true
        type: string

jobs:
  import:
    if: ${{ inputs.confirmation == 'IMPORT' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check SQL file exists
        run: test -f mira_airboost_batch01.sql

      - name: Import SQL into Cloudflare D1
        run: npx --yes wrangler@4 d1 execute mira-product-database --remote --file=mira_airboost_batch01.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
